# Lista de contenedores (servicios) que se arrancan juntos
services:

  # Contenedor de desarrollo: aquí viven el código, Python y Claude Code
  app:
    # Construye la imagen con el Dockerfile de esta misma carpeta
    #   - context: carpeta con los ficheros para construir (.devcontainer)
    #   - dockerfile: nombre del fichero de construcción
    #   - args: tu UID y GID de Ubuntu, leídos del fichero .devcontainer/.env (si no existe, 1000)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    # Monta la carpeta del proyecto dentro del contenedor
    #   - ..: la carpeta padre de .devcontainer, es decir, la raíz del proyecto
    #   - /workspace: ruta donde aparece dentro del contenedor
    volumes:
      - ..:/workspace
    # Mantiene el contenedor encendido sin hacer nada; VS Code se conecta a él
    command: sleep infinity
    # Variables de entorno que leerá Django para conectarse a las bases de datos
    #   - DATABASE_URL: dirección de la base de la plataforma (usuario:contraseña@servicio:puerto/base)
    #   - BOVEDA_DATABASE_URL: dirección de la bóveda de identidad, con su propio usuario
    #   - BOVEDA_CLAVE_HMAC: clave secreta para calcular las huellas del DNI y del correo
    #     oficial; vive fuera de la base de datos (en producción, en un gestor de secretos)
    #   - REDIS_URL: dirección de Redis (servicio:puerto/número de base)
    environment:
      DATABASE_URL: postgres://asambleas:asambleas@db:5432/asambleas
      BOVEDA_DATABASE_URL: postgres://boveda:boveda@db:5432/boveda
      BOVEDA_CLAVE_HMAC: solo-para-desarrollo-cambiar-en-produccion
      REDIS_URL: redis://redis:6379/0
      # Editor colaborativo en tiempo real (servicio «editor», más abajo; ver base/editor.py)
      #   - EDITOR_URL: dirección WebSocket del editor desde el navegador (el puerto 1234 se abre abajo)
      #   - EDITOR_URL_INTERNA: dirección del editor desde la plataforma, dentro de Docker
      #   - EDITOR_SECRETO: secreto que comparten la plataforma y el editor (el mismo que en «editor»)
      EDITOR_URL: ws://localhost:1234
      EDITOR_URL_INTERNA: http://editor:1234
      EDITOR_SECRETO: solo-para-desarrollo-cambiar-en-produccion
    # Arranca primero la base de datos y Redis
    depends_on:
      - db
      - redis

  # Editor colaborativo en tiempo real: servicio aparte, en Node (carpeta editor/; ver editor/LEEME.md).
  # Varias personas escriben a la vez el mismo texto; la plataforma decide quién entra con pases firmados.
  editor:
    # Imagen oficial de Node 20 sobre Debian 13, versión reducida
    image: node:20-trixie-slim
    # Usuario con el que se ejecuta: el tuyo, para que lo que cree (node_modules, datos) sea tuyo
    #   - HOST_UID, HOST_GID: tu número de usuario y de grupo (si no existen, 1000)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # El mismo código que «app»
    #   - ..: la raíz del proyecto
    #   - /workspace: donde aparece dentro del contenedor
    volumes:
      - ..:/workspace
    # Carpeta en la que se ejecutan las órdenes: la del editor
    working_dir: /workspace/editor
    # Instala sus librerías (la primera vez tarda), construye el cliente del navegador y lo arranca
    #   - npm install --no-audit --no-fund: instala lo de editor/package.json sin avisos de más
    #   - npm run construir: crea editor/publico/cliente.js
    #   - npm run arrancar: arranca editor/src/servidor.mjs
    command: bash -c "npm install --no-audit --no-fund && npm run construir && npm run arrancar"
    # Variables del editor
    #   - HOME: carpeta para la caché de npm (el usuario no tiene otra en esta imagen)
    #   - EDITOR_PUERTO: puerto en el que escucha
    #   - EDITOR_DATOS: carpeta donde guarda su copia de cada sala
    #   - EDITOR_APLICACIONES: las aplicaciones que lo usan, con su secreto, la dirección a la que llama
    #     (la plataforma, en el contenedor «app», puerto 8000) y las carpetas de primer nivel de plantillas y
    #     fragmentos que ve (la plataforma, solo «Actas»)
    #   - EDITOR_CLAVE: clave con la que cifra la biblioteca (32 bytes en base64). Esta es solo para
    #     desarrollo: en producción, otra (openssl rand -base64 32), guardada aparte; si se pierde, se pierde
    #     la biblioteca
    environment:
      HOME: /tmp
      EDITOR_PUERTO: "1234"
      EDITOR_DATOS: /workspace/editor/datos
      EDITOR_APLICACIONES: '{"asambleas": {"secreto": "solo-para-desarrollo-cambiar-en-produccion", "url": "http://app:8000/editor", "carpetas": ["Actas"]}}'
      EDITOR_CLAVE: p7W1ang9nadfmH153EJnuLo0Uwk64iDtNKd/684axXU=
    # Abre el puerto al navegador de tu ordenador
    #   - "1234:1234": el 1234 de tu ordenador va al 1234 del contenedor
    ports:
      - "1234:1234"
    # Si se para por un error, vuelve a arrancar solo
    restart: unless-stopped

  # Trabajador: entrega los avisos asíncronos de eventos_sw (notificaciones…) en cuanto aparecen en la
  # bandeja de salida. Es provisional hasta elegir Celery o RQ (docs/diseno.md, apartado 20); entonces
  # solo cambiará esta orden. Usa la misma imagen y las mismas variables que «app».
  trabajador:
    # Misma construcción que «app» (ver arriba)
    #   - context, dockerfile, args: los mismos que en «app»
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    # El mismo código que «app»
    #   - ..: la raíz del proyecto
    #   - /workspace: donde aparece dentro del contenedor
    volumes:
      - ..:/workspace
    # Carpeta en la que se ejecuta la orden
    working_dir: /workspace
    # Instala las dependencias de Python (la primera vez tarda; después solo comprueba que están) y
    # procesa la bandeja en bucle
    #   - bash -c: ejecuta las dos órdenes seguidas, la segunda solo si la primera sale bien (&&)
    #   - pip install --user -q -r requirements.txt: instala lo de requirements.txt en la carpeta del
    #     usuario, sin mostrar detalles
    #   - procesar_bandeja: la orden del módulo eventos_sw
    #   - --espera 2: cuando no hay nada pendiente, espera 2 segundos antes de volver a mirar
    command: bash -c "pip install --user -q -r requirements.txt && python manage.py procesar_bandeja --espera 2"
    # Las mismas variables que «app» (bases de datos, clave HMAC y Redis)
    environment:
      DATABASE_URL: postgres://asambleas:asambleas@db:5432/asambleas
      BOVEDA_DATABASE_URL: postgres://boveda:boveda@db:5432/boveda
      BOVEDA_CLAVE_HMAC: solo-para-desarrollo-cambiar-en-produccion
      REDIS_URL: redis://redis:6379/0
    # Si se para por un error (por ejemplo, la base aún no está lista), vuelve a arrancar solo
    restart: unless-stopped
    # Arranca después de la base de datos y Redis
    depends_on:
      - db
      - redis

  # Base de datos PostgreSQL 17 (imagen oficial sobre Debian 13)
  db:
    image: postgres:17-trixie
    # Credenciales iniciales (solo para desarrollo, nunca en producción)
    #   - POSTGRES_USER: usuario administrador
    #   - POSTGRES_PASSWORD: su contraseña
    #   - POSTGRES_DB: base de datos que se crea al arrancar
    environment:
      POSTGRES_USER: asambleas
      POSTGRES_PASSWORD: asambleas
      POSTGRES_DB: asambleas
    # Guarda los datos en un volumen y prepara la bóveda en instalaciones nuevas
    #   - pgdata: nombre del volumen; /var/lib/postgresql/data es donde Postgres guarda sus datos
    #   - ./initdb: carpeta con scripts que Postgres ejecuta UNA sola vez, cuando el volumen
    #     está vacío (instalación nueva); crea la base y el usuario de la bóveda
    #   - /docker-entrypoint-initdb.d: carpeta donde la imagen oficial busca esos scripts
    #   - :ro: solo lectura, el contenedor no puede modificarlos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

  # Redis 8: caché, tiempo real y cola de tareas (imagen oficial sobre Debian 13)
  redis:
    image: redis:8-trixie
    # Guarda cada cambio en disco (además de las copias periódicas), para que un reinicio no pierda las
    # papeletas que esperan en la urna de las consultas secretas (consultas/urna.py)
    #   - --appendonly yes: apunta cada escritura en un fichero que se relee al arrancar
    command: redis-server --appendonly yes
    # Guarda los datos de Redis en un volumen, para que sigan aunque se rehaga el contenedor
    #   - redisdata: nombre del volumen; /data es donde Redis guarda sus ficheros
    volumes:
      - redisdata:/data

# Declaración de los volúmenes con nombre usados arriba
volumes:
  pgdata:
  redisdata: