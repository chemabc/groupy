{% comment %}
  Etiqueta de color con el estado de un proyecto. Recibe «proyecto».
{% endcomment %}
<span class="rounded px-1.5 text-xs {% if proyecto.estado == 'finalizado' %}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300{% elif proyecto.estado == 'funcionando' %}bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300{% elif proyecto.estado == 'sin_empezar' %}bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300{% else %}bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300{% endif %}">{{ proyecto.get_estado_display }}</span>
